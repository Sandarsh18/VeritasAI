services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "ollama ps >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - veritas_sqlite_data:/app/data
      - veritas_tmp:/app/tmp
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
      args:
        # Empty by default -> the React app uses same-origin relative paths
        # (/api/...) that nginx proxies to the backend service. This avoids
        # host-port and CORS issues entirely inside Docker.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/test
    ports:
      - "7474:7474"
      - "7687:7687"
    profiles:
      - neo4j

volumes:
  ollama_data:
  veritas_sqlite_data:
  veritas_tmp:

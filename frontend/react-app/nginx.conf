server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Use Docker's embedded DNS resolver and a variable so nginx does NOT
    # fail to start when the "backend" service is not yet resolvable.
    # (Previously nginx crashed at boot with: host not found in upstream "backend")
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
